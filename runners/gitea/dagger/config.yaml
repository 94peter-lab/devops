log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  envs: {}
  timeout: 3h
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest"
    - "ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"
    - "self-hosted:host"

cache:
  enabled: true
  dir: "/home/runner/.cache/actcache"
  host: ""
  port: 0

container:
  network: ""
  options:
  privilege: false
  workdir_parent:
