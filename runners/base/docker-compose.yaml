version: '3.8'

services:
  runner:
    # Pre-built by .github/workflows/build-runner-image.yml and published to
    # GHCR. Pull the exact tag you want to run — there is no "latest" tag,
    # each image is pinned to a specific runner_version + dagger_version pair.
    # Example: ghcr.io/94peter-lab/gh-runner:2.319.1-dagger-0.20.3
    image: ${RUNNER_IMAGE}
    container_name: github-runner
    restart: always
    environment:
      # Credential resolution: GitHub App (if all three GITHUB_APP_* resolve,
      # via env or Infisical) takes priority over GITHUB_TOKEN. Anything left
      # unset here falls back to an Infisical secret of the same name, if the
      # INFISICAL_* vars below are set.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID:-}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID:-}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET:-}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID:-}
      - INFISICAL_ENV=${INFISICAL_ENV:-prod}
      - INFISICAL_SECRET_PATH=${INFISICAL_SECRET_PATH:-/}
      # Set exactly one of REPO_URL (repo-level runner) or ORG_URL (org-level runner).
      - REPO_URL=${REPO_URL:-}
      - ORG_URL=${ORG_URL:-}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,coolify}
      - DAGGER_VERSION=${DAGGER_VERSION:-0.12.0}
      - FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true
      - RUNNER_NAME=${RUNNER_NAME:-coolify-runner}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dagger-cache:/home/runner/.cache/dagger
    # Ensure the runner can access the host docker socket
    # Note: On some systems, you might need to specify the group id of docker
    # group_add:
    #   - "999" 

volumes:
  dagger-cache:
    driver: local
