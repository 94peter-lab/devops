name: Build Gitea Docker-Push Runner Image

on:
  workflow_dispatch:
    inputs:
      act_runner_version:
        description: 'Gitea act_runner version to bake into the image (e.g. 0.2.11)'
        required: true
        default: '3.5.0'
        type: string
      buildx_version:
        description: 'docker/buildx version to bake into the image (e.g. 0.19.3)'
        required: true
        default: '0.19.3'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./runners/gitea/docker-push
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            ACT_RUNNER_VERSION=${{ inputs.act_runner_version }}
            BUILDX_VERSION=${{ inputs.buildx_version }}
          tags: ghcr.io/${{ github.repository_owner }}/gitea-docker-push-runner:${{ inputs.act_runner_version }}-buildx-${{ inputs.buildx_version }}

      - name: Print published tag
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/gitea-docker-push-runner:${{ inputs.act_runner_version }}-buildx-${{ inputs.buildx_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
