name: Build Runner Image

on:
  workflow_dispatch:
    inputs:
      dagger_version:
        description: 'Dagger CLI version to bake into the image'
        required: true
        type: string
      runner_version:
        description: 'ghcr.io/actions/actions-runner base image tag to build from'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./runners/base
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DAGGER_VERSION=${{ inputs.dagger_version }}
            RUNNER_VERSION=${{ inputs.runner_version }}
          tags: ghcr.io/${{ github.repository_owner }}/gh-runner:${{ inputs.runner_version }}-dagger-${{ inputs.dagger_version }}

      - name: Print published tag
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/gh-runner:${{ inputs.runner_version }}-dagger-${{ inputs.dagger_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
