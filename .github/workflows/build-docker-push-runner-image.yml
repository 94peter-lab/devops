name: Build Docker-Push Runner Image

on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'ghcr.io/actions/actions-runner base image tag to build from'
        required: true
        type: string
      buildx_version:
        description: 'docker/buildx release version to bake into the image (with or without a leading "v", e.g. 0.19.3 or v0.19.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./runners/docker-push
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUNNER_VERSION=${{ inputs.runner_version }}
            BUILDX_VERSION=${{ inputs.buildx_version }}
          tags: ghcr.io/${{ github.repository_owner }}/gh-runner-docker-push:${{ inputs.runner_version }}-buildx-${{ inputs.buildx_version }}

      - name: Print published tag
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/gh-runner-docker-push:${{ inputs.runner_version }}-buildx-${{ inputs.buildx_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
