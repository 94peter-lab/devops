version: '3.8'

services:
  runner:
    build:
      context: ./runners/base
      dockerfile: Dockerfile
      args:
        DAGGER_VERSION: ${DAGGER_VERSION:-0.20.3}
    image: devops-infra-runner:latest
    container_name: github-runner
    restart: always
    environment:
      # If GITHUB_TOKEN is set, it takes priority. Otherwise it is fetched from
      # Infisical using the INFISICAL_* vars below (all three are required).
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID:-}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET:-}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID:-}
      - INFISICAL_ENV=${INFISICAL_ENV:-prod}
      - INFISICAL_SECRET_PATH=${INFISICAL_SECRET_PATH:-/}
      - INFISICAL_SECRET_NAME=${INFISICAL_SECRET_NAME:-GITHUB_TOKEN}
      - REPO_URL=${REPO_URL}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,coolify}
      - DAGGER_VERSION=${DAGGER_VERSION:-0.12.0}
      - FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true
      - RUNNER_NAME=${RUNNER_NAME:-coolify-runner}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dagger-cache:/home/runner/.cache/dagger
    # Ensure the runner can access the host docker socket
    # Note: On some systems, you might need to specify the group id of docker
    # group_add:
    #   - "999" 

volumes:
  dagger-cache:
    driver: local
